name: Windows smoke-test

# Manually-triggered: installs a published Upiqal .msi on a clean
# windows-latest runner, launches it, waits for the sidecar to spin up,
# and uploads every bit of diagnostic state we can get our hands on —
# engine.log, process list, Defender events, install tree — as a workflow
# artifact. Used for post-release triage when an end user reports
# "engine offline" without a console to copy-paste from.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install (e.g. v1.0.4)"
        required: true
        default: "v1.0.4"

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Show runner info
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Is64Bit: $([Environment]::Is64BitOperatingSystem)"
          Write-Host "User: $env:USERNAME"
          Write-Host "LOCALAPPDATA: $env:LOCALAPPDATA"
          Write-Host "APPDATA: $env:APPDATA"

      - name: Download Upiqal .msi from release ${{ inputs.tag }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          Write-Host "Downloading Upiqal_*_x64_en-US.msi from $tag"
          gh release download $tag --repo ${{ github.repository }} --pattern "Upiqal_*_x64_en-US.msi" --dir .
          Get-ChildItem *.msi | Format-Table FullName,Length

      - name: Install MSI silently
        shell: pwsh
        run: |
          $msi = (Get-ChildItem *.msi | Select-Object -First 1).FullName
          Write-Host "Installing $msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart /l*v install.log" -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Get-Content install.log -Tail 80
            exit $p.ExitCode
          }

      - name: Verify install layout
        shell: pwsh
        run: |
          $root = "C:\Program Files\Upiqal"
          Write-Host "`n=== Install root: $root ==="
          Get-ChildItem $root -ErrorAction SilentlyContinue | Format-Table Name,Length
          Write-Host "`n=== Upiqal.exe version ==="
          (Get-Item "$root\Upiqal.exe").VersionInfo | Format-List FileVersion,ProductVersion
          $sidecar = "$root\resources\binaries\upiqal-engine-x86_64-pc-windows-msvc\upiqal-engine.exe"
          Write-Host "`n=== Sidecar present? $(Test-Path $sidecar) ==="
          if (Test-Path $sidecar) {
            Write-Host "`n=== Sidecar dir contents ==="
            Get-ChildItem "$root\resources\binaries\upiqal-engine-x86_64-pc-windows-msvc" | Format-Table Name,Length
          }

      - name: Run sidecar directly (baseline)
        shell: pwsh
        run: |
          $sidecar = "C:\Program Files\Upiqal\resources\binaries\upiqal-engine-x86_64-pc-windows-msvc\upiqal-engine.exe"
          if (-not (Test-Path $sidecar)) { Write-Host "missing"; exit 0 }
          Write-Host "Launching sidecar for 10s, capturing stdout..."
          $p = Start-Process $sidecar -PassThru -RedirectStandardOutput sidecar-out.txt -RedirectStandardError sidecar-err.txt -NoNewWindow
          Start-Sleep -Seconds 10
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "`n--- sidecar stdout ---"
          Get-Content sidecar-out.txt -ErrorAction SilentlyContinue
          Write-Host "`n--- sidecar stderr ---"
          Get-Content sidecar-err.txt -ErrorAction SilentlyContinue

      - name: Launch Upiqal.exe and wait for sidecar
        shell: pwsh
        run: |
          $exe = "C:\Program Files\Upiqal\Upiqal.exe"
          Write-Host "Launching $exe"
          $p = Start-Process $exe -PassThru
          Write-Host "Upiqal.exe PID: $($p.Id)"
          Start-Sleep -Seconds 20
          Write-Host "`n=== Processes matching upiqal* ==="
          Get-Process | Where-Object { $_.ProcessName -like "upiqal*" } |
            Select-Object Id,ProcessName,Path,WorkingSet | Format-Table -AutoSize
          Write-Host "`n=== Listening loopback ports (127.0.0.1) ==="
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalAddress -eq "127.0.0.1" } |
            Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize

      # End-to-end loopback HTTP check: parse the port + token out of the
      # diagnostic log written by engine.rs, then hit /healthz with the
      # bearer token. This is exactly what the React UI's fetch() call
      # would do. If this returns 200 with algorithm_available=true, the
      # "engine offline" chip in the UI is wrong OR the user's bundle is
      # different from what CI ships.
      - name: Probe engine /healthz with bearer token
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\com.upiqal.desktop\engine.log"
          if (-not (Test-Path $log)) {
            Write-Host "engine.log not found at $log — engine never reached spawn_engine"
            exit 1
          }
          $content = Get-Content $log -Raw
          $port = ($content | Select-String -Pattern 'UPIQAL_ENGINE_PORT=(\d+)' -AllMatches).Matches[-1].Groups[1].Value
          $token = ($content | Select-String -Pattern 'UPIQAL_ENGINE_TOKEN=([A-Za-z0-9_\-]+)' -AllMatches).Matches[-1].Groups[1].Value
          if (-not $port -or -not $token) {
            Write-Host "Could not parse port/token from engine.log"
            Get-Content $log
            exit 1
          }
          $url = "http://127.0.0.1:$port/healthz"
          Write-Host "Probing $url with bearer token (len=$($token.Length))"
          try {
            $resp = Invoke-WebRequest -Uri $url -Headers @{ Authorization = "Bearer $token" } -UseBasicParsing -TimeoutSec 10
            Write-Host "HTTP status: $($resp.StatusCode)"
            Write-Host "Body: $($resp.Content)"
          } catch {
            Write-Host "Health probe failed: $_"
            Write-Host "Attempting unauthenticated probe for comparison..."
            try {
              $r2 = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              Write-Host "Unauth status: $($r2.StatusCode) (unexpected!)"
            } catch {
              Write-Host "Unauth probe also failed: $_"
            }
            exit 1
          }

      - name: Capture desktop screenshot (Upiqal UI state)
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $screen.Width,$screen.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($screen.Location,[System.Drawing.Point]::Empty,$screen.Size)
          $bmp.Save("upiqal-ui.png",[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Write-Host "Screenshot saved: upiqal-ui.png ($((Get-Item upiqal-ui.png).Length) bytes)"

      # Real compare test: fetch a pair of tiny reference/target PNGs from
      # the FR-IQA-Algo repo, stash them under a path with a Cyrillic
      # directory name (repro for the charmap codec bug), then POST to
      # /api/compare-paths with the bearer token — exactly what the UI's
      # Compare button triggers. Asserts we get a JSON report with a
      # numeric score back, not an __UPIQAL_ERROR__ string.
      - name: Run a real compare via /api/compare-paths
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\com.upiqal.desktop\engine.log"
          $content = Get-Content $log -Raw
          $port = ($content | Select-String -Pattern 'UPIQAL_ENGINE_PORT=(\d+)' -AllMatches).Matches[-1].Groups[1].Value
          $token = ($content | Select-String -Pattern 'UPIQAL_ENGINE_TOKEN=([A-Za-z0-9_\-]+)' -AllMatches).Matches[-1].Groups[1].Value
          Write-Host "Using port=$port, token len=$($token.Length)"

          # Non-ASCII parent dir to reproduce the Windows encoding issue
          # users hit with e.g. C:\Users\Артём\... paths.
          $testDir = "$env:TEMP\upiqal-тест"
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          $ref = "$testDir\left.png"
          $tgt = "$testDir\right.png"

          $refUrl = "https://raw.githubusercontent.com/katolikov/FR-IQA-Algo/main/docs/examples/cartoon_A_reference.png"
          $tgtUrl = "https://raw.githubusercontent.com/katolikov/FR-IQA-Algo/main/docs/examples/cartoon_B_target.png"
          try {
            Invoke-WebRequest -Uri $refUrl -OutFile $ref -UseBasicParsing
            Invoke-WebRequest -Uri $tgtUrl -OutFile $tgt -UseBasicParsing
          } catch {
            Write-Host "Failed to download test PNGs: $_"
            exit 1
          }
          Write-Host "Reference: $ref ($((Get-Item $ref).Length) bytes)"
          Write-Host "Target:    $tgt ($((Get-Item $tgt).Length) bytes)"

          # Relaunch Upiqal.exe so the sidecar is hot for the compare.
          Start-Process "C:\Program Files\Upiqal\Upiqal.exe" | Out-Null
          Start-Sleep -Seconds 8

          # Re-read the (new) port + token after relaunch.
          $content2 = Get-Content $log -Raw
          $port = ($content2 | Select-String -Pattern 'UPIQAL_ENGINE_PORT=(\d+)' -AllMatches).Matches[-1].Groups[1].Value
          $token = ($content2 | Select-String -Pattern 'UPIQAL_ENGINE_TOKEN=([A-Za-z0-9_\-]+)' -AllMatches).Matches[-1].Groups[1].Value
          Write-Host "Relaunched — port=$port, token len=$($token.Length)"

          $body = @{
            reference_path = $ref
            target_path    = $tgt
            session_id     = "ci-smoke"
            pair_id        = "pair-1"
            params         = @{ max_side = 256; score_mode = "sigmoid" }
          } | ConvertTo-Json -Depth 4

          $headers = @{
            Authorization = "Bearer $token"
            "Content-Type" = "application/json"
          }
          $url = "http://127.0.0.1:$port/api/compare-paths"
          Write-Host "POST $url"

          try {
            $resp = Invoke-WebRequest -Uri $url -Method POST -Headers $headers -Body $body -UseBasicParsing -TimeoutSec 180
            Write-Host "HTTP status: $($resp.StatusCode)"
            $report = $resp.Content | ConvertFrom-Json
            Write-Host "=== CompareReport (truncated) ==="
            Write-Host "score        : $($report.score)"
            Write-Host "score_label  : $($report.score_label)"
            Write-Host "dominant     : $($report.dominant_artifact)"
            Write-Host "severity     : $($report.severity_bars | ConvertTo-Json -Compress)"
            Write-Host "heatmap keys : $($report.heatmaps.PSObject.Properties.Name -join ', ')"
            if ($null -eq $report.score) { throw "score missing — compare didn't produce a valid report" }
            $resp.Content | Set-Content -Path "compare-report.json" -Encoding UTF8
          } catch {
            Write-Host "Compare failed: $_"
            Write-Host "=== Last 40 lines of engine.log ==="
            Get-Content $log -Tail 40
            exit 1
          }

      - name: Cleanup processes
        if: always()
        shell: pwsh
        run: |
          Stop-Process -Name "Upiqal" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "upiqal-engine" -Force -ErrorAction SilentlyContinue

      - name: Collect engine.log and related diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diag -Force | Out-Null
          Write-Host "=== Search for engine.log under LOCALAPPDATA + APPDATA ==="
          $logs = Get-ChildItem -Path $env:LOCALAPPDATA,$env:APPDATA -Recurse -Filter engine.log -ErrorAction SilentlyContinue
          $logs | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize
          foreach ($l in $logs) {
            Copy-Item $l.FullName "diag\$($l.Directory.Name)__engine.log" -ErrorAction SilentlyContinue
          }
          Write-Host "`n=== com.upiqal.desktop dir contents ==="
          Get-ChildItem "$env:LOCALAPPDATA\com.upiqal.desktop" -ErrorAction SilentlyContinue -Recurse | Format-Table FullName,Length
          Copy-Item "install.log" "diag\msiexec.log" -ErrorAction SilentlyContinue
          Copy-Item "sidecar-out.txt" "diag\sidecar-stdout.txt" -ErrorAction SilentlyContinue
          Copy-Item "sidecar-err.txt" "diag\sidecar-stderr.txt" -ErrorAction SilentlyContinue
          Copy-Item "upiqal-ui.png" "diag\upiqal-ui.png" -ErrorAction SilentlyContinue
          Copy-Item "compare-report.json" "diag\compare-report.json" -ErrorAction SilentlyContinue

      - name: Dump all collected engine.log content inline
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem diag\*engine.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=============================================="
            Write-Host "=== $($_.FullName) ==="
            Write-Host "=============================================="
            Get-Content $_.FullName
          }
          Write-Host "`n=============================================="
          Write-Host "=== sidecar-stdout.txt ==="
          Write-Host "=============================================="
          Get-Content diag\sidecar-stdout.txt -ErrorAction SilentlyContinue
          Write-Host "`n=============================================="
          Write-Host "=== sidecar-stderr.txt ==="
          Write-Host "=============================================="
          Get-Content diag\sidecar-stderr.txt -ErrorAction SilentlyContinue

      - name: Upload diag artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ inputs.tag }}
          path: diag/*
          if-no-files-found: warn
