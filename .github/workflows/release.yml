name: Release

# Trigger: tag pushes like `v1.2.3`. Each matrix job builds the Python
# sidecar + Tauri bundle for its platform, then uploads the installer
# back to the GitHub Release that `softprops/action-gh-release` creates
# (or appends to) once every job has finished.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave blank to build a draft."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon (aarch64). Runs on the native `macos-14`
          # runner so we don't have to cross-compile.
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_glob: "src-tauri/target/release/bundle/{dmg,macos}/*"
          # Intel macOS.
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_glob: "src-tauri/target/release/bundle/{dmg,macos}/*"
          # Windows x86_64.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: "src-tauri/target/release/bundle/msi/* src-tauri/target/release/bundle/nsis/*"
          # Linux x86_64.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_glob: "src-tauri/target/release/bundle/appimage/* src-tauri/target/release/bundle/deb/*"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # -- Toolchains --------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -- Platform-specific system deps -------------------------------
      - name: Install Linux system deps (Tauri bundler)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # -- Cache pip + cargo for faster subsequent runs ---------------
      - name: Cache pip wheels (Torch CPU is heavy)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/AppData/Local/pip/Cache
            ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('engine/requirements.txt', 'engine/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # -- Build the Python engine sidecar -----------------------------
      - name: Install Python deps
        # `requirements.txt` already declares the torch CPU index via
        # its own `--extra-index-url` directive, so pip needs no extra
        # flags. `--index-strategy` is a uv-only option and must NOT
        # be passed to pip.
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt -r engine/requirements-dev.txt
        shell: bash

      - name: Vendor FR-IQA-Algo (if sibling checkout is available)
        run: python engine/scripts/vendor_algorithm.py || echo "(no sibling checkout — assuming engine/vendor is pre-populated)"
        shell: bash

      - name: Build PyInstaller sidecar
        run: python engine/scripts/build_sidecar.py
        shell: bash

      # -- Build the UI + Tauri bundle ---------------------------------
      - name: Install UI deps
        run: npm ci

      - name: Tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.conf.json --target ${{ matrix.target }}

      # -- Upload to the GitHub Release --------------------------------
      - name: Collect bundle artefacts
        id: collect
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb dist/ 2>/dev/null || true
          ls -la dist/
        shell: bash

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload workflow artefacts (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: upiqlo-${{ matrix.target }}
          path: dist/*
          if-no-files-found: warn
