[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upiqlo-engine"
version = "0.1.0"
description = "Local FastAPI sidecar that wraps the UPIQAL (FR-IQA) algorithm for the Upiqlo desktop app."
requires-python = ">=3.11,<3.13"
authors = [{ name = "Upiqlo" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "numpy>=1.24,<3.0",
  "scipy>=1.10",
  # torch/torchvision are installed separately from the CPU index.
  # See engine/requirements.txt.
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
  "pyinstaller>=6.10",
]

[tool.setuptools]
packages = ["upiqlo_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
